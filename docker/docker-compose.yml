services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pennyats
      POSTGRES_PASSWORD: pennyats
      POSTGRES_DB: pennyats
    ports:
      - "5432:5432"
    volumes:
      - pennyats_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennyats"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pennyats_pgdata:
