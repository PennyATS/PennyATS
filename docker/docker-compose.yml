services:
  db:
    # Matches the version PennyATS is developed and tested on.
    image: postgres:18
    environment:
      POSTGRES_USER: pennyats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pennyats}
      POSTGRES_DB: pennyats
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data in a versioned folder under /var/lib/postgresql,
      # so the volume mounts there (not /var/lib/postgresql/data as in older images).
      - pennyats_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennyats"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://pennyats:${POSTGRES_PASSWORD:-pennyats}@db:5432/pennyats}
      STORAGE_DIR: /app/apps/web/.data/uploads
      # Scripts run in this container (such as pnpm webhooks:deliver) open stored secrets too.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Password for the restricted role the app connects as (row-level security, docs/rls.md).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-${POSTGRES_PASSWORD:-pennyats}}
    volumes:
      - pennyats_uploads:/app/apps/web/.data/uploads
    # Apply migrations as the owner, then create or update the app's restricted role.
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:app-role"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://pennyats:${POSTGRES_PASSWORD:-pennyats}@db:5432/pennyats}
      # The app connects as pennyats_app, which cannot bypass row-level security (#119).
      APP_DATABASE_URL: ${COMPOSE_APP_DATABASE_URL:-postgres://pennyats_app:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD:-pennyats}}@db:5432/pennyats}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Required. Encrypts stored calendar tokens and webhook secrets; the app refuses to start
      # without a random value of 32+ characters. Generate one with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_REDACT_PII: ${AI_REDACT_PII:-true}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - pennyats_uploads:/app/apps/web/.data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pennyats_pgdata:
  pennyats_uploads:
