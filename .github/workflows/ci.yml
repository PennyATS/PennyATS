name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Unit tests need no database or secrets.
      - run: pnpm test

      - run: pnpm build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and start database, migrations, and app
        run: docker compose -f docker/docker-compose.yml up --build -d

      - name: Check first-run setup from a clean database
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/setup -o /tmp/pennyats-setup.html 2>/dev/null && grep -q "Set up your workspace" /tmp/pennyats-setup.html; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Show container status on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml ps
          docker compose -f docker/docker-compose.yml logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
