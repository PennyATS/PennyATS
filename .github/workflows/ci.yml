name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Unit tests need no database or secrets.
      - run: pnpm test

      - run: pnpm build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build the images
        run: docker compose -f docker/docker-compose.yml build

      - name: App refuses to start without a real AUTH_SECRET
        run: |
          docker compose -f docker/docker-compose.yml up -d db
          out=$(docker compose -f docker/docker-compose.yml run --rm -T --no-deps app 2>&1) && exit 1
          echo "$out" | grep -q "AUTH_SECRET is not set"
          out=$(AUTH_SECRET=changeme-changeme-changeme-changeme docker compose -f docker/docker-compose.yml run --rm -T --no-deps app 2>&1) && exit 1
          echo "$out" | grep -q "example value"

      - name: Start database, migrations, and app with a generated secret
        run: |
          export AUTH_SECRET=$(openssl rand -base64 32)
          echo "AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
          docker compose -f docker/docker-compose.yml up -d

      - name: Check first-run setup from a clean database
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/setup -o /tmp/pennyats-setup.html 2>/dev/null && grep -q "Set up your workspace" /tmp/pennyats-setup.html; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Check uploads volume is writable
        run: docker compose -f docker/docker-compose.yml exec -T app node -e "const fs = require('node:fs'); const file = process.env.STORAGE_DIR + '/ci-write-check'; fs.writeFileSync(file, 'ok'); fs.unlinkSync(file)"

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pennyats/web exec playwright install --with-deps chromium

      - name: Set up the first admin and add a webhook in the browser
        run: COMPOSE_BASE_URL=http://localhost:3000 pnpm --filter @pennyats/web test:compose

      - name: Show container status on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml ps
          docker compose -f docker/docker-compose.yml logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  demo:
    name: Public demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f docker/docker-compose.yml -f docker/docker-compose.demo.yml
      DEMO_RESET_HOURS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the demo
        run: |
          export AUTH_SECRET=$(openssl rand -base64 32)
          echo "AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
          $COMPOSE up --build -d

      - name: Wait for the first reset and check the banner and demo accounts
        run: |
          for attempt in {1..90}; do
            if curl -fsS http://localhost:3000/login -o /tmp/login.html 2>/dev/null               && grep -q "Public demo with fictional data" /tmp/login.html               && grep -q "Demo accounts" /tmp/login.html; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Reset again
        run: $COMPOSE run --rm --no-deps demo-reset pnpm demo:reset

      - name: demo:reset refuses a database it did not create
        run: |
          $COMPOSE exec -T db psql -U pennyats -d pennyats -c "delete from settings where key = 'demo_instance'"
          if $COMPOSE run --rm --no-deps demo-reset pnpm demo:reset; then exit 1; fi

      - name: db:seed refuses a database set up through /setup
        run: |
          $COMPOSE exec -T db psql -U pennyats -d pennyats -c "update users set email = 'owner@acme.test' where email = 'admin@example.com'"
          if $COMPOSE run --rm --no-deps demo-reset pnpm db:seed; then exit 1; fi

      - name: Show container status on failure
        if: failure()
        run: |
          $COMPOSE ps
          $COMPOSE logs --no-color

      - name: Stop containers
        if: always()
        run: $COMPOSE down -v

  platform:
    name: One-click deploy image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pennyats
          POSTGRES_PASSWORD: pennyats
          POSTGRES_DB: pennyats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pennyats -d pennyats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB: postgres://pennyats:pennyats@127.0.0.1:5432/pennyats
    steps:
      - uses: actions/checkout@v4

      - name: Build the one-click image
        run: docker build -f docker/Dockerfile.platform -t pennyats-platform .

      - name: Refuses to start without a generated secret
        run: |
          if docker run --rm --network host -e DATABASE_URL=$DB -e APP_URL=http://localhost:3000 pennyats-platform; then exit 1; fi
          if docker run --rm --network host -e DATABASE_URL=$DB -e APP_URL=http://localhost:3000 \
            -e AUTH_SECRET=changeme-changeme-changeme-changeme pennyats-platform; then exit 1; fi

      - name: Start like a host would (root-owned volume, generated address)
        run: |
          sudo mkdir -p /srv/pennyats-uploads
          echo "SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo 'RUN=docker run -d --name app --network host -e DATABASE_URL=postgres://pennyats:pennyats@127.0.0.1:5432/pennyats -e RENDER_EXTERNAL_URL=http://localhost:3000 -v /srv/pennyats-uploads:/data/uploads' >> "$GITHUB_ENV"

      - name: First deploy migrates and reaches setup
        run: |
          $RUN -e AUTH_SECRET="$SECRET" pennyats-platform
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 \
              && curl -fsS http://localhost:3000/setup | grep -q "Set up your workspace"; then
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Uploads persist across a redeploy
        run: |
          docker exec -u node app sh -c 'echo ok > "$STORAGE_DIR/persist-check"'
          docker rm -f app
          $RUN -e AUTH_SECRET="$SECRET" pennyats-platform
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              docker exec -u node app sh -c 'test "$(cat "$STORAGE_DIR/persist-check")" = ok && touch "$STORAGE_DIR/write-check"'
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker logs app || true

  integration:
    name: Browser and database integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pennyats
          POSTGRES_PASSWORD: pennyats
          POSTGRES_DB: pennyats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pennyats -d pennyats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pennyats:pennyats@127.0.0.1:5432/pennyats_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pennyats/web exec playwright install --with-deps chromium

      - name: Run browser and database flow
        run: pnpm test:integration

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
