name: Feature request
description: Suggest something PennyATS should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check the roadmap board first; it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the hiring situation, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: today
    attributes:
      label: How do you handle this today?
